name: phyt-DNA Gate

on: [push, pull_request]

jobs:
  gate:
    env:
      # ★ 一处设、全局稳（2026-10-11）：判据里不要各自 hack locale（那会引入 2>/dev/null，被闸门6 禁）
      LC_ALL: C.UTF-8
    runs-on: ubuntu-24.04   # ★ 钉住（2026-10-10）：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26
                           #   ⇒ 不钉住 = 9 天后由【外部变更】决定我们的红绿（"今天绿"可能纯因环境）
                           #   冻结是默认；预演 26 应是一次【有意】的实验，不是被动接受
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 1 · 闸门资产完整性（ADR-0004 检测器）
        run: ./tools/check-baseline.sh

      - name: 2 · 规范自检（spec-lint）
        run: ./tools/spec-lint.sh docs/PROTECTION.md

      - name: 3 · 全部闸门能力心跳
        # ★ 一步，不再自己复制一遍"哪些文件算闸门"（那是 `gates()` 的事，见 tools/validate.sh）。
        # 曾经这里有一段 `for id in $(ls decisions/*.md …) ; grep '^hard: true$'` —— 与引擎的发现逻辑
        # 是【第二份清单】(A5)：我修 gates()（只认 ADR-*.md）时，这一段不经过它，于是不受益。
        # 现在它调用引擎，于是：ADR-*.md 的限制 · 无夹具即失败（unproven ≠ alive）· 两世界读数，全都自动同源。
        run: |
          set -o pipefail   # ★ 必须：否则 `| tee` 把失败掩盖成成功（本地实测：带=1 / 不带=0）
          ./tools/validate.sh --probe-all 2>&1 | tee /tmp/phyt-gate.log

      - name: 4 · 全仓库违规扫描（只跑 timing:post 闸门）
        # timing:pre 是路径黑名单，事后全仓扫描必然误报 ⇒ 只扫 post 型
        # ★ 2026-10-25：**用 { …; } | tee 落盘**，不用 `exec > >(tee …)`（后者 tee 未 flush ⇒ 日志空 ⇒ 失败具名拿不到东西）；
        #   且失败时打印【文件 + 门名 + 引擎前 3 行】⇒ annotations 里能直接看到哪道门。
        run: |
          set -o pipefail
          {
            fail=0
            for f in $(git -c core.quotePath=false ls-files '*.md' '*.py' '*.sh' '*.yml'); do
              out=$(printf '{"tool":"Write","paths":["%s"]}\n' "$f" | ./tools/validate.sh --timing post 2>&1)
              rc=$?
              if [ "$rc" = 2 ]; then
                rid=$(printf '%s' "$out" | grep -oE '"rule_id":"[^"]+' | head -1 | sed 's/"rule_id":"//')
                echo "违规: $f ⇒ 门=${rid:-（未解析）}"
                printf '%s' "$out" | head -3 | sed 's/^/         /'
                fail=1
              fi
            done
            exit $fail
          } 2>&1 | tee -a /tmp/phyt-gate.log

      - name: 5 · 规范自检（spec-lint）· 必须真实可红
        # ⚠️ 永绿装饰 = 伪证（T0-2）。本步曾被「git diff --exit-code 检查 .claude/」占据
        # —— 该检查在 CI checkout 下恒绿。换成 spec-lint，让"规范自身未过闸门"能真实
        # 变红；与 step2 双保险，防止装饰性检查被重写回去（ADR-…-lesson-must-land-in-artifact）。
        run: ./tools/spec-lint.sh docs/PROTECTION.md

      - name: 6 · 失败具名（annotations 公开可读 · 总会运行）
        # ★ 为什么存在：读 CI 失败的四条通道里，logs 需 admin(403) · artifacts 需凭据(401) ·
        #   job summary 只在网页（API 的 output.summary 为 null）⇒ **annotation 是唯一机器可读的**。
        #   脚本各仓自带一份（引擎纪律：不跨仓取文件），会自己找共享日志并**明说读了哪个**。
        # ★ 机制事实（2026-10-11 实测）：**`::error` 不是"打印"，是"判决"** —— 它会把所在步骤判红。
        #   ⇒ 本步必须 `if: failure()`：绿 run 上若也发射 `::error`（日志里几乎总有匹配行），
        #     就会**把绿 run 判红**（我把它改成 `always` 后确实发生了）⇒ 回退。
        if: failure()
        run: bash tools/emit-failures.sh
